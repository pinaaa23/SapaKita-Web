name: Deploy PasCall Web Dashboard to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy-web:
    name: Build & Deploy Frontend to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.pascall.id' }}

      - name: Deploy static files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "dist/*"
          target: "/home/ubuntu/PasCall-Web"
          strip_components: 0

      - name: Finish
        run: echo "✅ Web Dashboard berhasil diperbarui dan disajikan langsung oleh Caddy!"
